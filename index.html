<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-OS v3.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <canvas id="matrix-bg" class="matrix-bg"></canvas>
    <div class="background"></div>
    
    <div id="desktop" class="relative w-full h-[calc(100vh-50px)] p-5">
        <div class="desktop-icons absolute top-5 left-5" id="desktop-icons">
            <div class="desktop-icon" id="icon-minesweeper" data-app="minesweeper" ondblclick="openApp('minesweeper')">
                <div class="icon"><i class="fa-solid fa-bomb"></i></div>
                <div class="label">MINESWEEPER</div>
            </div>
            <div class="desktop-icon" id="icon-notepad" data-app="notepad" ondblclick="openApp('notepad')">
                <div class="icon"><i class="fa-solid fa-file-lines"></i></div>
                <div class="label">NOTEPAD</div>
            </div>
            <div class="desktop-icon" id="icon-calculator" data-app="calculator" ondblclick="openApp('calculator')">
                <div class="icon"><i class="fa-solid fa-calculator"></i></div>
                <div class="label">CALCULATOR</div>
            </div>
            <div class="desktop-icon" id="icon-settings" data-app="settings" ondblclick="openApp('settings')">
                <div class="icon"><i class="fa-solid fa-gear"></i></div>
                <div class="label">SETTINGS</div>
            </div>
            <div class="desktop-icon" id="icon-about" data-app="about" ondblclick="openApp('about')">
                <div class="icon"><i class="fa-solid fa-circle-info"></i></div>
                <div class="label">ABOUT</div>
            </div>
            <div class="desktop-icon" id="icon-terminal" data-app="terminal" ondblclick="openApp('terminal')">
                <div class="icon"><i class="fa-solid fa-terminal"></i></div>
                <div class="label">TERMINAL</div>
            </div>
            <div class="desktop-icon" id="icon-calendar" data-app="calendar" ondblclick="openApp('calendar')">
                <div class="icon"><i class="fa-solid fa-calendar"></i></div>
                <div class="label">CALENDAR</div>
            </div>
            <div class="desktop-icon" id="icon-system-monitor" data-app="system-monitor" ondblclick="openApp('system-monitor')">
                <div class="icon"><i class="fa-solid fa-chart-line"></i></div>
                <div class="label">MONITOR</div>
            </div>
        </div>
    </div>

    <div id="taskbar" class="h-[50px] flex items-center justify-between px-5 absolute bottom-0 w-full">
        <div class="taskbar-apps flex gap-2" id="taskbar-apps"></div>
        <div class="system-tray flex items-center gap-5">
            <div id="clock">00:00:00</div>
        </div>
    </div>

    <script src="js/matrix-bg.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/apps/minesweeper.js"></script>
    <script src="js/apps/notepad.js"></script>
    <script src="js/apps/calculator.js"></script>
    <script src="js/apps/settings.js"></script>
    <script src="js/apps/about.js"></script>
    <script src="js/apps/terminal.js"></script>
    <script src="js/apps/calendar.js"></script>
    <script src="js/apps/system-monitor.js"></script>
    <script src="js/window-manager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
